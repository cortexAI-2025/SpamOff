name: Android V1
on:
  push:
    paths: ['app/**', 'scripts/**', 'data/**', '*.gradle.kts', 'gradle/**', 'gradlew', 'gradle.properties', '.github/workflows/**']
  pull_request:
    paths: ['app/**', 'scripts/**', 'data/**', '*.gradle.kts', 'gradle/**', 'gradlew', 'gradle.properties', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleBeta assembleRelease assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: SpamOff-APK-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/beta/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/
  instrumented:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            if [ "${{ matrix.api }}" = "35" ]; then python3 scripts/emulator_calls.py && ./gradlew assembleBeta && python3 scripts/optimized_smoke.py; fi
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/fr.spamoff/files/home-api-${{ matrix.api }}.png app/build/reports/screenshots/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/screenshots/
            app/build/reports/emulator-calls.json
            app/build/reports/optimized-smoke.json
